# Render Blueprint for menosan-api: staging + prod web services from the Dockerfile.
# Create it once in Render: New → Blueprint → this repo. Render asks for every `sync: false` value.
# See docs/ENVIRONMENTS.md §3 for the full procedure.
#
# Region: Singapore, next to Neon (aws ap-southeast-1).
# Plans: Starter (always on, 512 MB). Free instances sleep after 15 idle minutes: ~1 min cold starts for testers,
# and a restart forgets the staging dev clock (/internal/dev/clock) and the photo rate-limit counters.

services:
  - type: web
    name: menosan-api-staging
    runtime: docker
    region: singapore
    plan: starter
    numInstances: 1
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass # redeploy on every push to main, once CI is green
    envVars:
      - key: APP_ENV
        value: staging
      - key: PORT
        value: "8080"
      - key: DEV_TOOLS_ENABLED
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: menosan-app
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: JOB_KEY
        generateValue: true # different from prod; copy it from the dashboard for scripts/e2e-staging.sh
      - key: DATABASE_URL # Neon dev, pooled (JDBC format, see .env.example)
        sync: false
      - key: DATABASE_URL_DIRECT # Neon dev, direct (Flyway)
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: menosan-api
    runtime: docker
    region: singapore
    plan: starter
    numInstances: 1 # the photo rate limiter is per instance (docs/DECISIONS.md)
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: "off" # deploy by hand after staging passes the e2e run
    envVars:
      - key: APP_ENV
        value: prod
      - key: PORT
        value: "8080"
      - key: FIREBASE_PROJECT_ID
        value: menosan-app
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: JOB_KEY
        generateValue: true # also goes into the GitHub secret JOB_KEY for weekly-reports.yml
      - key: DATABASE_URL # Neon main, pooled
        sync: false
      - key: DATABASE_URL_DIRECT # Neon main, direct. The first prod start applies V1–V3 here.
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: GEMINI_API_KEY # billing-enabled key if possible (plan §13)
        sync: false
